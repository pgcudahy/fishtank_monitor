# Board: NodeMCU-32S (NodeMCU)
# Definition: definitions/boards/nodemcu-32s/manifest.yaml

esphome:
  name: fishtank
  friendly_name: fishtank

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

# If you enable MQTT and you do not use the Api,
# you must remove the api: configuration or set reboot_timeout: 0s,
# otherwise the ESP will reboot every 15 minutes because no client connected to the native API.
#api:
#  encryption:
#    key: "g4fClnzjjwkFgILs7F2KSutOG1+CSbIm/sKOH77Nx9k="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.18.3
    gateway: 192.168.18.1
    subnet: 255.255.255.0
  ap:
    ssid: fishtank Fallback Hotspot
    password: "v9jHWeLq0ln3"

captive_portal:

time:
  - platform: sntp
    id: sntp_time
    timezone: "Africa/Johannesburg"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org

mqtt:
  broker: 192.168.18.18
  username: fishtank
  password: !secret fishtank__mqtt_password

one_wire:
  - platform: gpio
    pin: GPIO04

sensor:
  - platform: dallas_temp
    name: water_temperature
    update_interval: 60s
    # Publish value + measurement time (Unix seconds) at QoS 1 so the broker
    # queues readings while the monitor is down. Skipped until SNTP has synced.
    on_value:
      then:
        - if:
            condition:
              time.has_time:
            then:
              - mqtt.publish_json:
                  topic: fishtank/reading/water_temperature
                  qos: 1
                  payload: |-
                    root["ts"] = id(sntp_time).now().timestamp;
                    root["value"] = x;
