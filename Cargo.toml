[package]
name = "fishtank_monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3.34"
native-tls = "0.2.18"
polars = { version = "0.55.2", default-features = false, features = ["csv", "dtype-datetime", "temporal", "fmt", "lazy"] }
postgres-native-tls = "0.5.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "default-tls"] }
rumqttc = "0.25.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "net", "rt-multi-thread"] }
tokio-postgres = "0.7.18"
toml = "1.1.6"
